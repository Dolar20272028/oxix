<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Exchange | CryptoPix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); font-family: 'Inter', sans-serif; color: #f8fafc; overflow-x: hidden; }
        .neon-border { box-shadow: 0 0 15px rgba(234, 179, 8, 0.3), inset 0 0 15px rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
        .btn-gold { background: linear-gradient(45deg, #eab308, #ca8a04); transition: all 0.3s ease; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); }
        .glow-text { text-shadow: 0 0 10px rgba(234, 179, 8, 0.8); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass neon-border w-full max-w-lg rounded-3xl p-8 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-yellow-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl"></div>
        <div class="text-center mb-8">
            <div class="inline-block p-3 rounded-full bg-yellow-500/10 mb-4">
                <svg class="w-12 h-12 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="font-orbitron text-3xl font-bold glow-text text-yellow-500 tracking-widest mb-2">GENESIS EXCHANGE</h1>
            <p class="text-slate-400 text-sm uppercase tracking-tighter">Sistema de Liquidação Instantânea</p>
        </div>
        <div class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Valor para Troca (USDT)</label>
                <input type="number" id="amount" value="100" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-xl font-orbitron text-yellow-500 outline-none focus:border-yellow-500 transition-all" placeholder="0.00">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Ativo Digital</label>
                <select id="asset" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-slate-300 outline-none focus:border-yellow-500 transition-all appearance-none cursor-pointer">
                    <option value="BTC">Bitcoin (BTC)</option>
                    <option value="ETH">Ethereum (ETH)</option>
                    <option value="USDT">Tether (USDT)</option>
                    <option value="SOL">Solana (SOL)</option>
                </select>
            </div>
            <button onclick="simular()" class="btn-gold w-full py-4 rounded-xl font-orbitron font-bold text-slate-900 text-lg uppercase tracking-wider">Simular Operação</button>
            <div id="result" class="hidden p-4 rounded-xl bg-slate-900/80 border border-slate-700 text-center animate-pulse">
                <p class="text-slate-400 text-xs uppercase mb-1">Cotação Estimada</p>
                <p id="quote" class="text-2xl font-orbitron text-yellow-500 font-bold"></p>
            </div>
            <div id="error" class="hidden p-4 rounded-xl bg-red-500/10 border border-red-500/50 text-red-400 text-sm text-center">Erro: Falha na conexão com o servidor.</div>
        </div>
    </div>
    <script>
        const API_URL = 'https://oxix-wepz.onrender.com';
        async function simular() {
            const amount = document.getElementById('amount').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const quoteText = document.getElementById('quote');
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            try {
                const response = await fetch(\`\${API_URL}/check_status\`);
                if (!response.ok) throw new Error();
                const cotação = (amount * 5.2).toFixed(2);
                quoteText.innerText = \`R$ \${cotação}\`;
                resultDiv.classList.remove('hidden');
            } catch (e) {
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
