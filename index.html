<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENESIS EXCHANGE | Liquidação Instantânea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05070a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(234, 179, 8, 0.1);
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(234, 179, 8, 0.6);
            box-shadow: 0 0 50px rgba(234, 179, 8, 0.15);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        .input-field {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(234, 179, 8, 0.2);
            color: white;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .input-field:focus {
            border-color: #eab308;
            outline: none;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
            filter: brightness(1.1);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        #result {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glass-card p-8 w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-yellow-500 neon-text tracking-tighter mb-2">GENESIS EXCHANGE</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest font-medium">Sistema de Liquidação Instantânea</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-2 ml-1">Valor para Troca (USDT)</label>
                <input type="number" id="amount" placeholder="0.00" class="input-field w-full p-4 rounded-xl text-lg">
            </div>

            <div>
                <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-2 ml-1">Ativo Digital</label>
                <select id="asset" class="input-field w-full p-4 rounded-xl text-lg appearance-none cursor-pointer">
                    <option value="ETH">Ethereum (ETH)</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                    <option value="SOL">Solana (SOL)</option>
                </select>
            </div>

            <button onclick="simulate()" class="btn-primary w-full p-4 rounded-xl text-sm">
                Simular Operação
            </button>
        </div>

        <div id="result" class="mt-8 p-6 rounded-2xl bg-yellow-500/10 border border-yellow-500/20 text-center">
            <p class="text-gray-400 text-xs uppercase mb-1">Cotação Final</p>
            <div id="quote-value" class="text-3xl font-bold text-yellow-500">R$ 0,00</div>
            <p id="fee-info" class="text-[10px] text-gray-500 mt-2"></p>
        </div>
    </div>

    <script>
        async function simulate() {
            const amount = document.getElementById('amount').value;
            const asset = document.getElementById('asset').value;
            const resultDiv = document.getElementById('result');
            const quoteVal = document.getElementById('quote-value');
            const feeInfo = document.getElementById('fee-info');

            if (!amount || amount <= 0) {
                alert('Por favor, insira um valor válido.');
                return;
            }

            try {
                // URL do seu servidor Render
                const response = await fetch(`https://oxix-wepz.onrender.com/simulate?amount=${amount}&asset=${asset}`);
                
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                
                const data = await response.json();

                resultDiv.style.display = 'block';
                quoteVal.innerText = `R$ ${data.final_amount.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                feeInfo.innerText = `Taxa aplicada: ${data.fee_percent}% (${data.fee_amount} USDT)`;
                
            } catch (error) {
                console.error(error)`;
                alert('Erro de Conexão: O servidor está online, mas a requisição foi bloqueada. Tente desativar VPNs ou use outro navegador.');
            }
        }
    </script>
</body>
</html>
