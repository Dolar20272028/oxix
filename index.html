<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Exchange | USDT to PIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Biblioteca para gerar QR Code localmente, sem depender de API externa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-image: url('banner.jpg');
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #fbbf24;
            outline: none;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3);
        }
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #qrcode img {
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="glass-card w-full max-w-md rounded-3xl p-8 text-white">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tight mb-2">Genesis Exchange</h1>
                <p class="text-gray-300 text-sm">Conversão Instantânea USDT $\rightarrow$ PIX</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-gray-400 mb-2">Sua Chave PIX para Recebimento</label>
                    <div class="relative">
                        <input type="text" id="pixKey" placeholder="CPF, E-mail ou Celular" 
                               class="input-field w-full px-4 py-4 rounded-2xl text-lg font-semibold placeholder-gray-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-gray-400 mb-2">Valor em USDT</label>
                    <div class="relative">
                        <input type="number" id="usdtAmount" placeholder="0.00" 
                               class="input-field w-full px-4 py-4 rounded-2xl text-xl font-semibold placeholder-gray-500">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-gray-400">USDT</span>
                    </div>
                </div>

                <div class="flex justify-center">
                    <div class="bg-yellow-500 p-2 rounded-full shadow-lg">
                        <i data-lucide="arrow-down" class="text-black w-6 h-6"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-gray-400 mb-2">Você recebe (BRL)</label>
                    <div class="relative">
                        <input type="text" id="brlAmount" readonly placeholder="R$ 0,00" 
                               class="input-field w-full px-4 py-4 rounded-2xl text-xl font-semibold text-yellow-400 cursor-not-allowed">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-gray-400">BRL</span>
                    </div>
                </div>

                <button onclick="calculateAndSave()" 
                        class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="calculator" class="w-5 h-5"></i>
                    Simular Conversão
                </button>
            </div>

            <div id="paymentArea" class="hidden mt-8 pt-8 border-t border-white/20 space-y-6">
                <div class="text-center">
                    <p class="text-sm text-gray-300 mb-4">Selecione a rede para depósito:</p>
                    
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        <button onclick="selectNetwork('TRC20')" id="btnTRC20" class="network-btn py-2 rounded-lg text-xs font-bold border border-white/20 hover:bg-white/10 transition-all">TRC20</button>
                        <button onclick="selectNetwork('ERC20')" id="btnERC20" class="network-btn py-2 rounded-lg text-xs font-bold border border-white/20 hover:bg-white/10 transition-all">ERC20</button>
                        <button onclick="selectNetwork('BEP20')" id="btnBEP20" class="network-btn py-2 rounded-lg text-xs font-bold border border-white/20 hover:bg-white/10 transition-all">BEP20</button>
                    </div>

                    <div id="qrContainer" class="hidden flex flex-col items-center animate-in fade-in duration-500">
                        <div class="bg-white p-3 rounded-2xl mb-4">
                            <!-- O QR Code será gerado dentro desta div -->
                            <div id="qrcode"></div>
                        </div>
                        <p class="text-xs text-gray-400 mb-2 uppercase font-bold">Endereço da Carteira</p>
                        <div class="flex items-center gap-2 bg-black/40 p-3 rounded-xl border border-white/10 w-full overflow-hidden">
                            <code id="walletAddress" class="text-xs text-yellow-400 truncate"></code>
                            <button onclick="copyAddress()" class="text-gray-400 hover:text-white transition-colors">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const wallets = {
            'TRC20': 'tpshuvrrmbwp5scwkc3hsdxanush5njkk6',
            'ERC20': '0xc6c86c35f6d204db217daf854e55f2a817392355',
            'BEP20': '0xc6c86c35f6d204db217daf854e55f2a817392355'
        };

        const API_URL_CALC = 'https://oxix-wepz.onrender.com/api/v1/calc_7x';
        const API_URL_EXEC = 'https://oxix-wepz.onrender.com/api/v1/exec_9z';

        // Instância global do gerador de QR Code
        let qrGenerator = null;

        async function calculateAndSave() {
            const pixKey = document.getElementById('pixKey').value;
            const amount = document.getElementById('usdtAmount').value;

            if (!pixKey) {
                alert('Por favor, informe sua chave PIX para recebermos o valor.');
                return;
            }
            if (!amount || amount <= 0) {
                alert('Informe um valor válido de USDT.');
                return;
            }

            try {
                const calcResponse = await fetch(`${API_URL_CALC}?valor=${amount}`);
                const calcData = await calcResponse.json();

                if (calcData.error) {
                    alert(calcData.error);
                    return;
                }

                await fetch(API_URL_EXEC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        pix_key: pixKey
                    })
                });

                document.getElementById('brlAmount').value = `R$ ${calcData.result.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('paymentArea').classList.remove('hidden');
                lucide.createIcons();

            } catch (e) {
                alert('Erro ao conectar com o servidor. Verifique sua conexão.');
            }
        }

        function selectNetwork(network) {
            document.querySelectorAll('.network-btn').forEach(btn => {
                btn.classList.remove('bg-yellow-500', 'text-black');
                btn.classList.add('text-white');
            });

            const activeBtn = document.getElementById(`btn${network}`);
            activeBtn.classList.add('bg-yellow-500', 'text-black');
            activeBtn.classList.remove('text-white');

            const address = wallets[network];
            
            // Limpa o QR Code anterior
            document.getElementById('qrcode').innerHTML = "";
            
            // Gera o novo QR Code localmente
            new QRCode(document.getElementById("qrcode"), {
                text: address,
                width: 192,
                height: 192,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            document.getElementById('walletAddress').innerText = address;
            document.getElementById('qrContainer').classList.remove('hidden');
        }

        function copyAddress() {
            const address = document.getElementById('walletAddress').innerText;
            navigator.clipboard.writeText(address);
            alert('Endereço copiado!');
        }

        lucide.createIcons();
    </script>
</body>
</html>
