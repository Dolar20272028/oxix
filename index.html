<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoPix Genesis | WE ARE ALL SATOSHI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #b8860b 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #b8860b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 32px; }
        .input-field { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(234, 179, 8, 0.2); color: white; transition: all 0.3s ease; font-family: 'JetBrains Mono', monospace; }
        .input-field:focus { border-color: #eab308; outline: none; box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
        .btn-primary { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 800; text-transform: uppercase; transition: all 0.3s; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4); }
        .btn-primary:hover { transform: translateY(-3px); filter: brightness(1.1); }
        #paymentModal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .hero-image { width: 100%; height: auto; max-height: 60vh; object-fit: cover; border-bottom: 3px solid #d4af37; }
    </style>
</head>
<body>

    <!-- BANNER DE IMPACTO -->
    <div class="w-full relative">
        <img src="banner.jpg" alt="CryptoPix Genesis Banner" class="hero-image">
        <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#05070a] to-transparent"></div>
    </div>

    <!-- CONTEÚDO OPERACIONAL -->
    <main class="flex flex-col items-center justify-center p-6 -mt-10 relative z-10">
        <div class="glass-card p-8 w-full max-w-md relative overflow-hidden">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-yellow-500 tracking-tighter mb-2">GENESIS EXCHANGE</h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em] font-medium">Liquidação Digital Autônoma</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-2 ml-1">Valor para Troca (USDT)</label>
                    <input type="number" id="amount" placeholder="0.00" class="input-field w-full p-4 rounded-2xl text-lg">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-2 ml-1">Ativo de Origem</label>
                    <select id="asset" class="input-field w-full p-4 rounded-2xl text-lg appearance-none cursor-pointer">
                        <option value="USDT">Tether (USDT - TRC20)</option>
                        <option value="BTC">Bitcoin (BTC)</option>
                        <option value="ETH">Ethereum (ETH)</option>
                    </select>
                </div>

                <button onclick="simulate()" id="btnSimulate" class="btn-primary w-full p-4 rounded-2xl text-sm">
                    Simular Operação
                </button>
            </div>

            <!-- Resultado da Simulação -->
            <div id="result" class="hidden mt-8 p-6 rounded-3xl bg-yellow-500/10 border border-yellow-500/20 text-center animate-pulse">
                <p class="text-gray-400 text-xs uppercase mb-1">Cotação Final Estimada</p>
                <div id="quote-value" class="text-4xl font-bold text-yellow-500 mb-2">R$ 0,00</div>
                <p id="fee-info" class="text-[10px] text-gray-500 mb-6"></p>
                
                <div class="mb-6 text-left">
                    <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-2 ml-1">Chave PIX para Recebimento</label>
                    <input type="text" id="pix_key" placeholder="CPF, Email ou Telefone" class="input-field w-full p-4 rounded-2xl text-sm">
                </div>

                <button onclick="startTransaction()" class="btn-primary w-full p-4 rounded-2xl text-sm">
                    Iniciar Troca Agora
                </button>
            </div>
        </div>
    </main>

    <!-- Modal de Pagamento -->
    <div id="paymentModal" class="p-6">
        <div class="glass-card w-full max-w-sm p-8 text-center relative border-yellow-500/50">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="mb-6">
                <h2 class="text-xl font-bold text-white mb-1">Confirmar Depósito</h2>
                <p class="text-xs text-gray-400">Transfira o valor exato para a carteira abaixo</p>
            </div>
            <div class="bg-black/40 p-4 rounded-2xl border border-yellow-500/20 mb-6">
                <p class="text-[10px] text-gray_text-left">Endereço USDT (TRC20)</p>
                <div class="flex items-center justify-between gap-2">
                    <span id="walletAddress" class="text-xs font-mono break-all text-yellow-500">Carregando...</span>
                    <button onclick="copyWallet()" class="p-2 bg-white/10 rounded-lg hover:bg-white/20 transition-all">
                        <i data-lucide="copy" class="w-4 h-4 text-white"></i>
                    </button>
                </div>
            </div>
            <div class="bg-white p-3 rounded-2xl w-48 h-48 mx-auto mb-6 flex items-center justify-center">
                <img id="qrCode" src="" alt="QR Code" class="w-full h-full hidden">
                <div id="qrLoading" class="animate-spin rounded-full h-8 w-8 border-b-2 border-yellow-500"></div>
            </div>
            <button onclick="confirmPayment()" class="btn-primary w-full py-4 rounded-2xl text-sm">
                Já realizei o envio
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://oxix-wepz.onrender.com";
        
        async function simulate() {
            const amount = document.getElementById('amount').value;
            const asset = document.getElementById('asset').value;
            const resultDiv = document.getElementById('result');
            const quoteVal = document.getElementById('quote-value');
            const feeInfo = document.getElementById('fee-info');

            if (!amount || amount <= 0) { alert('Insira um valor válido.'); return; }

            try {
                const response = await fetch(`${API_URL}/simulate?amount=${amount}&asset=${asset}`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                const quote = data.quote || data; 
                
                resultDiv.classList.remove('hidden');
                quoteVal.innerText = `R$ ${quote.final_amount.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                feeInfo.innerText = `Taxa aplicada: ${quote.fee_percent}% (${quote.fee_amount} USDT)`;
            } catch (error) { alert('Erro de conexão. Tente novamente.'); }
        }

        async function startTransaction() {
            const amount = document.getElementById('amount').value;
            const pixKey = document.getElementById('pix_key').value;
            const modal = document.getElementById('paymentModal');
            const walletSpan = document.getElementById('walletAddress');
            const qrImg = document.getElementById('qrCode');
            const qrLoad = document.getElementById('qrLoading');

            if (!pixKey) { alert('Por favor, informe sua chave PIX para receber o valor.'); return; }

            try {
                const response = await fetch(`${API_URL}/create_transaction`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseFloat(amount), pix_key: pixKey })
                });
                const data = await response.json();
                if (data.wallet) {
                    walletSpan.innerText = data.wallet;
                    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data.wallet}`;
                    qrImg.classList.remove('hidden');
                    qrLoad.classList.add('hidden');
                    modal.style.display = 'flex';
                }
            } catch (error) { alert('Erro ao gerar carteira.'); }
        }

        function copyWallet() {
            const text = document.getElementById('walletAddress').innerText;
            navigator.clipboard.writeText(text);
            alert('Endereço copiado!');
        }

        function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
        function confirmPayment() { alert('Pagamento registrado. Nossa rede está processando a liquidação automática para sua chave PIX.'); closeModal(); }
        lucide.createIcons();
    </script>
</body>
</html>
